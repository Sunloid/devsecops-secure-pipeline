name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r app -ll

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python p/flask p/owasp-top-ten

  sca:
    name: SCA (Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk test
        run: snyk test --file=app/requirements.txt --severity-threshold=high

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sast, sca]
    permissions: 
      issues: write
      contents: read
    services:
      vault:
        image: hashicorp/vault
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: myroot
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Wait for Vault to be ready
        run: |
          for i in {1..10}; do
            curl -s http://127.0.0.1:8200/v1/sys/health && break
            echo "Waiting for Vault..."
            sleep 2
          done

      - name: Seed Vault secrets
        run: |
          curl --header "X-Vault-Token: myroot" \
               --request POST \
               --data '{"data":{"secret_key":"ci-test-key-0123456789abcdef","db_password":"SuperSecret123!"}}' \
               http://127.0.0.1:8200/v1/secret/data/flask-app

      - name: Start Flask app in background
        run: |
          cd app
          nohup python app.py > app.log 2>&1 &
          sleep 5
          cat app.log
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: myroot

      - name: Confirm app is up
        run: curl -v http://localhost:5000

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          fail_action: false
          artifact_name: "zap-scan-report"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          fail_action: false
          cmd_options: "-I"