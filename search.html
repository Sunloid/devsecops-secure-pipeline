<!doctype html>
<title>Search</title>
<h1>Mini Store - Search</h1>
<form method="get">
  <input name="q" placeholder="Search products" value="">
  <button type="submit">Search</button>
</form>
{% if q %}
  <h3>Results for: {{ q|safe }}</h3>
  <ul>
  {% for name, price in results %}
    <li>{{ name }} - ${{ price }}</li>
  {% else %}
    <li>No results</li>
  {% endfor %}
  </ul>
{% endif %}
<p><a href="/login">Login</a></p>
